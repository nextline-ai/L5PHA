user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types_hash_max_size 4096;
  server_tokens off;
  access_log off;
  client_max_body_size 20k;
  client_body_buffer_size 32k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=management:1m rate=5r/s;
  server {
    listen 80 default_server;
    server_name @IP@;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/veyquant-acme; }
    location / { return 301 https://@IP@$uri; }
  }
  server {
    listen 443 ssl default_server;
    server_name @IP@;
    ssl_certificate /etc/letsencrypt/live/veyquant-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyquant-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /v1/providers/connect {
      limit_req zone=management burst=5 nodelay;
      proxy_pass http://unix:/run/veyquant-management/api.sock;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_read_timeout 110s;
      proxy_connect_timeout 3s;
    }
    location / {
      limit_req zone=management burst=15 nodelay;
      proxy_pass http://unix:/run/veyquant-management/api.sock;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_read_timeout 15s;
      proxy_connect_timeout 3s;
    }
  }
}
