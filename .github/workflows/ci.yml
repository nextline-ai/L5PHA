name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Official Playwright 1.62.1 image: browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.6.14
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync python scripts/check_public_tree.py
      - name: Scan complete public history for secrets
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --redact=100 --no-banner
      - run: uv run --no-sync pytest -q
      - run: npm ci --ignore-scripts
      - name: Verify reproducible UI build
        run: |
          expected_css=$(mktemp)
          cp src/veyquant/web/app.css "$expected_css"
          npm run build:ui
          cmp "$expected_css" src/veyquant/web/app.css
          rm "$expected_css"
      - run: npm audit --omit=dev --audit-level=moderate
      - run: uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r deploy/requirements.lock
      - run: npm run test:ui
      - run: npm run test:browser
      - run: uv run --no-sync cfn-lint infra/poc.yaml infra/runtime.yaml infra/analysis.yaml --regions ap-southeast-2 us-east-2 eu-north-1
      - run: uv run --no-sync cfn-lint infra/research.yaml --regions ap-northeast-1
      - run: uv run --no-sync cfn-lint infra/operations.yaml --regions ap-southeast-2
      - run: uv run --no-sync veyquant demo --db var/ci.sqlite3
      - name: Verify fresh installation bundle
        run: |
          uv run --no-sync python scripts/build_install_release.py --output var/install-ci --base-url https://l5pha-releases-709754297713.s3.ap-southeast-2.amazonaws.com/0.26.1
          uv run --no-sync cfn-lint var/install-ci/install.json --regions ap-southeast-2
